# `flutter gen-l10n` (also run by `flutter pub get`, since pubspec.yaml sets
# `generate: true`). Strings live in lib/l10n/app_<locale>.arb; the English
# file is the template every other locale is checked against. The generated
# Dart is committed so `flutter analyze` works on a fresh checkout.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
output-dir: lib/l10n/generated
synthetic-package: false
nullable-getter: false
